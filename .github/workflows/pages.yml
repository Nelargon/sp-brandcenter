name: Deploy to GitHub Pages

# El sitio es HTML estático: no hay build. El workflow sube el repo tal cual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que los archivos que el sitio referencia existen
        run: |
          set -e
          test -f index.html
          for f in $(grep -oE '(assets|descargas)/[A-Za-z0-9_./-]+\.[a-z0-9]+' index.html | sort -u); do
            test -f "$f" || { echo "::error::index.html referencia $f y no existe"; exit 1; }
          done
          echo "✓ todas las referencias resuelven"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
