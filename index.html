<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/logos/SP_Favicon.ico">
<meta name="description" content="Centro de Marca de Salud Protegida: logos, color, tipografia, voz y descargas.">
<title>Salud Protegida — Centro de Marca</title>
<style>
@font-face{font-family:'SPDisplay';font-weight:200 1000;font-style:normal;font-display:swap;src:url(assets/fonts/NunitoSans-Variable.woff2) format('woff2')}
@font-face{font-family:'SPText';font-weight:100 900;font-style:normal;font-display:swap;src:url(assets/fonts/Inter-Variable.woff2) format('woff2')}

:root{
  --ground:#FBFCFC; --surface:#FFFFFF; --surface-2:#F2F6F6; --line:#E1E9E9; --line-strong:#C9D6D6;
  --ink:#1D1D1B; --body:#3D3D3D; --muted:#6B6B6B; --faint:#5D6A6A;
  --teal:#00BCB4; --teal-text:#006B66; --teal-mid:#009690; --teal-wash:#E6F7F6;
  --navy:#003B71; --navy-deep:#002A52; --navy-wash:#E6EDF4;
  --amber:#F5A623; --amber-text:#8A5A00; --amber-wash:#FFF3E6;
  --no:#A81E12; --no-wash:#FCEEEC;
  --shadow:0 1px 2px rgba(0,42,82,.06),0 8px 24px -12px rgba(0,42,82,.18);
  --rail:260px; --bar:92px;
  --d:'SPDisplay','Segoe UI',system-ui,sans-serif;
  --t:'SPText',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#04121F; --surface:#0A1F33; --surface-2:#0F2A42; --line:#1B3C56; --line-strong:#2A5473;
  --ink:#EAF4F3; --body:#C3D6D8; --muted:#93AEB3; --faint:#849DA8;
  --teal-text:#80DDD8; --teal-mid:#4FCFC7; --teal-wash:#062B33;
  --navy-wash:#0B2942; --amber-text:#F5C271; --amber-wash:#2E2007;
  --no:#FF8A7A; --no-wash:#33110D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#04121F; --surface:#0A1F33; --surface-2:#0F2A42; --line:#1B3C56; --line-strong:#2A5473;
  --ink:#EAF4F3; --body:#C3D6D8; --muted:#93AEB3; --faint:#849DA8;
  --teal-text:#80DDD8; --teal-mid:#4FCFC7; --teal-wash:#062B33;
  --navy-wash:#0B2942; --amber-text:#F5C271; --amber-wash:#2E2007;
  --no:#FF8A7A; --no-wash:#33110D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --ground:#FBFCFC; --surface:#FFFFFF; --surface-2:#F2F6F6; --line:#E1E9E9; --line-strong:#C9D6D6;
  --ink:#1D1D1B; --body:#3D3D3D; --muted:#6B6B6B; --faint:#5D6A6A;
  --teal-text:#006B66; --teal-mid:#009690; --teal-wash:#E6F7F6;
  --navy-wash:#E6EDF4; --amber-text:#8A5A00; --amber-wash:#FFF3E6;
  --no:#A81E12; --no-wash:#FCEEEC;
  --shadow:0 1px 2px rgba(0,42,82,.06),0 8px 24px -12px rgba(0,42,82,.18);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font-family:var(--t);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.disp{font-family:var(--d);color:var(--ink);text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.4vw,44px);font-weight:800;letter-spacing:-.021em;line-height:1.1}
h2{font-size:23px;font-weight:800;letter-spacing:-.012em;margin-top:8px}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:60;height:var(--bar);display:flex;align-items:center;gap:30px;
 padding:0 28px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.09)}
/* El tamaño del logo del header NO es una decision estetica: sale de la regla
   que este mismo sitio publica. El isologotipo es 759x284 (razon 2,673:1) y su
   minimo digital es 180 px de ANCHO. Por lo tanto su alto minimo es
   180 / 2,673 = 67,3 px. Va a 68, el primer entero que cumple.
   (Antes estaba a 30 px de alto = 80 px de ancho: el header incumplia la regla
   de la pagina que tiene al lado.) */
.bar .logo-full{height:68px;display:block}
.bar .logo-icon{display:none}
.navwrap{position:relative}
.navbtn{font-family:var(--d);font-weight:700;font-size:13.5px;color:rgba(255,255,255,.88);
 background:none;border:0;padding:8px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;letter-spacing:.005em}
.navbtn:hover{color:#fff}
.drop{position:absolute;top:calc(100% + 6px);left:-12px;min-width:246px;background:var(--surface);
 border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:70}
.navwrap.on .drop{display:block}
.drop a{display:block;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--body)}
.drop a:hover{background:var(--surface-2);color:var(--ink)}
.spacer{flex:1}
.themebtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.burger{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:0;align-items:start}
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));overflow-y:auto;
 padding:26px 14px 40px 22px;border-right:1px solid var(--line)}
.rail .grp{font-family:var(--d);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
 color:var(--faint);margin:20px 0 7px 10px}
.rail .grp:first-child{margin-top:0}
.rail a{display:block;padding:6px 10px;border-radius:7px;font-size:13.5px;color:var(--muted);line-height:1.4}
.rail a:hover{color:var(--ink);background:var(--surface-2)}
.rail a.on{color:var(--ink);background:var(--surface-2);font-weight:600}
.rail a.sub{padding-left:22px;font-size:13px}
.main{padding:40px 44px 90px;min-width:0}
.wrap{max-width:860px}
.prose{max-width:66ch}

/* ---------- piezas ---------- */
.verdict{font-family:var(--d);font-weight:700;font-size:clamp(19px,2.3vw,25px);line-height:1.32;
 color:var(--teal-text);letter-spacing:-.011em;max-width:23ch;margin:14px 0 0}
.verdict.long{max-width:34ch}
.lede{margin-top:16px;font-size:16.5px;color:var(--body)}
.eyebrow{font-family:var(--d);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.rule{height:1px;background:var(--line);border:0;margin:44px 0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.note{border-left:3px solid var(--teal);background:var(--teal-wash);padding:13px 16px;border-radius:0 9px 9px 0;font-size:14.5px}
.warn{border-left:3px solid var(--amber);background:var(--amber-wash);padding:13px 16px;border-radius:0 9px 9px 0;font-size:14.5px}
.warn b,.note b{color:var(--ink)}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--d);font-weight:700;font-size:11.5px;letter-spacing:.055em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;letter-spacing:-.01em}

/* ---------- color ---------- */
.sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sw .chip{height:82px}
.sw .meta{padding:10px 12px 12px}
.sw .nm{font-family:var(--d);font-weight:700;font-size:13.5px;color:var(--ink)}
.copy{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;display:block;text-align:left}
.copy:hover{color:var(--teal-text)}
.pill{display:inline-block;font-family:var(--d);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2.5px 7px;border-radius:5px}
.p-ok{background:var(--teal-wash);color:var(--teal-text)}
.p-no{background:var(--no-wash);color:var(--no)}
.p-mid{background:var(--surface-2);color:var(--muted)}
.p-gap{background:var(--amber-wash);color:var(--amber-text)}
/* Bloque tecnico plegado. El sitio le habla a dos lectores: quien necesita la
   regla y quien necesita el numero. La regla va siempre primero, en castellano;
   el numero vive acá adentro, rotulado, para el que lo busca. */
.tech{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px}
.tech summary{cursor:pointer;padding:13px 0;font-family:var(--d);font-weight:700;font-size:14px;
 color:var(--ink);display:flex;align-items:center;gap:9px;list-style:none}
.tech summary::-webkit-details-marker{display:none}
.tech summary::after{content:"▾";margin-left:auto;color:var(--faint);font-size:12px;transition:transform .2s}
.tech[open] summary::after{transform:rotate(180deg)}
.tech summary:hover{color:var(--teal-text)}
.tag-tec{font-family:var(--d);font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
 background:var(--navy-wash);color:var(--teal-text);padding:3px 7px;border-radius:5px;flex:none}
.para-quien{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
 margin-top:10px;background:var(--surface-2);padding:5px 11px;border-radius:999px}
.para-quien b{font-family:var(--d);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

/* ---------- muro de usos indebidos ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:14px}
.bad{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.bad .stage{position:relative;height:118px;display:grid;place-items:center;overflow:hidden;background:#F7F8F6}
:root[data-theme="dark"] .bad .stage{background:#101B22}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bad .stage{background:#101B22}}
.bad .stage img{width:132px;display:block}
.bad .stage::after{content:"";position:absolute;inset:0;
 background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(168,30,18,.28) 50%,transparent calc(50% + 1px)),
            linear-gradient(to top left ,transparent calc(50% - 1px),rgba(168,30,18,.28) 50%,transparent calc(50% + 1px));
 pointer-events:none}
.bad .cap{padding:9px 12px 12px;font-size:12.8px;line-height:1.4;color:var(--no);font-weight:600}
.bad .cap span{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
/* ---------- lockup con otra marca ---------- */
.lk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;
 display:flex;align-items:stretch;justify-content:center;flex-wrap:nowrap;overflow-x:auto}
.lk img.sp{display:block;height:42px;width:auto;align-self:center;flex:none}
.lk .otra{display:grid;place-items:center;height:42px;padding:0 15px;flex:none;align-self:center;
 border:1px dashed var(--line-strong);border-radius:7px;font-family:var(--d);font-weight:800;font-size:10px;
 letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.lk .aire{flex:none;display:grid;place-items:center;background:var(--teal-wash);
 border-left:1px dashed var(--teal);border-right:1px dashed var(--teal);padding:0 4px;
 font-family:var(--d);font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--teal-text);white-space:nowrap}
.lk-cap{font-size:12.5px;color:var(--muted);margin-top:9px}
.lk-cap b{color:var(--ink)}

/* ---------- grilla de aliados ---------- */
.ally-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.ally{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
/* La caja queda blanca en los DOS temas a propósito: son marcas ajenas, con sus
   colores, dibujadas para fondo claro. Invertirlas en oscuro sería alterarlas. */
.ally .box{height:76px;display:grid;place-items:center;background:#FFFFFF;padding:12px}
.ally .box img{max-width:100%;max-height:52px;display:block}
.ally .nm{padding:9px 11px 3px;font-family:var(--d);font-weight:700;font-size:12.5px;color:var(--ink);line-height:1.25}
.ally .mt{padding:0 11px 10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.f-recolor{filter:hue-rotate(128deg) saturate(1.5)}
.f-stretch{transform:scaleX(1.5)}
.f-rotate{transform:rotate(-9deg)}
.f-shadow{filter:drop-shadow(4px 6px 2px rgba(0,0,0,.55))}
/* Las dos reglas de fondo van con la misma especificidad que `.bad .stage`
   (0,2,0) o el fondo plano de la tarjeta las gana en silencio. */
.f-outline{filter:brightness(0) invert(1)
  drop-shadow(1.5px 0 0 #003B71) drop-shadow(-1.5px 0 0 #003B71)
  drop-shadow(0 1.5px 0 #003B71) drop-shadow(0 -1.5px 0 #003B71)
  drop-shadow(1px 1px 0 #003B71) drop-shadow(-1px -1px 0 #003B71)
  drop-shadow(1px -1px 0 #003B71) drop-shadow(-1px 1px 0 #003B71)}
.f-tiny{width:44px !important}
.bad .stage.f-busy{background:repeating-conic-gradient(from 20deg,#6C3FA8 0 12%,#F5A623 0 25%) 0 0/34px 34px}
.bad .stage.f-pattern{background-repeat:repeat;background-size:58px;background-color:var(--surface-2)}
.f-box{background:#6C3FA8;padding:12px 16px;border-radius:9px}
.f-over{position:absolute;inset:0;display:grid;place-items:center}
.f-over b{background:var(--amber);color:#1D1D1B;font-family:var(--d);font-size:12px;padding:4px 9px;border-radius:5px;transform:rotate(-6deg)}
.lockup{display:flex;align-items:center;gap:9px}
.lockup em{font-family:var(--d);font-style:normal;font-weight:800;font-size:17px;color:var(--navy);letter-spacing:-.01em}
/* El azul del lockup necesita las DOS reglas, igual que .bad .stage acá arriba: con
   solo [data-theme="dark"] el color se aplica cuando alguien toca el interruptor, pero
   no cuando el sistema operativo ya está en oscuro y nadie lo tocó — que es el caso
   más común. Ahí quedaba navy sobre fondo oscuro: 1,55:1. */
:root[data-theme="dark"] .lockup em{color:#9FC4E6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockup em{color:#9FC4E6}}

/* ---------- descargas ---------- */
.asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.asset .prev{height:132px;display:grid;place-items:center;padding:18px}
.asset .prev img{max-width:78%;max-height:88px;display:block}
.bg-light{background:#F5F7F4}
.bg-navy{background:#003B71}
.bg-teal{background:#00BCB4}
.bg-check{background:
  linear-gradient(45deg,#E4E9E9 25%,transparent 25%,transparent 75%,#E4E9E9 75%),
  linear-gradient(45deg,#E4E9E9 25%,#F7F9F9 25%,#F7F9F9 75%,#E4E9E9 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.asset .info{padding:10px 13px 13px;border-top:1px solid var(--line)}
.asset .fn{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink);word-break:break-all}
.asset .mt{margin-top:5px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fmt{font-family:var(--d);font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--surface-2);color:var(--muted);padding:2px 6px;border-radius:4px}
.dl{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-family:var(--d);font-weight:700;font-size:12.5px;
 color:var(--teal-text);border:1px solid var(--line-strong);padding:5px 11px;border-radius:8px;background:var(--surface);cursor:pointer}
.dl:hover{border-color:var(--teal);background:var(--teal-wash)}
.packrow{display:flex;flex-wrap:wrap;gap:12px}
.pack{flex:1 1 210px;border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--surface)}
.pack .t{font-family:var(--d);font-weight:800;font-size:15px;color:var(--ink)}
.pack .s{font-size:13px;color:var(--muted);margin-top:3px}

/* ---------- home ---------- */
.hero{background:linear-gradient(133deg,var(--navy-deep) 0%,var(--navy) 46%,#00706B 100%);
 border-radius:16px;padding:44px 40px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:290px;height:290px;border-radius:50%;
 background:radial-gradient(circle,rgba(0,188,180,.42),transparent 68%)}
.hero h1{color:#fff;position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.86);margin-top:14px;max-width:52ch;position:relative;z-index:1;font-size:16.5px}
.hero .eyebrow{color:rgba(255,255,255,.62);position:relative;z-index:1}
.qcard{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface);display:block}
.qcard:hover{border-color:var(--teal)}
.qcard .top{height:96px;display:grid;place-items:center}
.qcard .bot{padding:12px 14px 14px}
.qcard .t{font-family:var(--d);font-weight:800;font-size:15px;color:var(--ink)}
.qcard .s{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}

/* ---------- íconos ---------- */
.ico-cell .prev{height:104px}
.ico-cell .prev img{width:64px;height:64px;max-width:none;max-height:none}
.ico-row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.ico-row img{width:52px;height:52px;display:block}

/* ---------- presentaciones ----------
   Las láminas de muestra y las familias de color son islas con colores FIJOS, como
   las tarjetas .demo de Color: muestran cómo se ve una lámina, que no cambia con el
   tema de este sitio. Por eso no van por token. */
.slide{aspect-ratio:16/9;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;
 padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between}
.slide .bandita{position:absolute;left:0;top:0;right:0;height:3.5%;background:#00BCB4}
.slide .lg{align-self:start;padding:5px 10px;border:1.5px dashed currentColor;border-radius:5px;white-space:nowrap;
 font-family:var(--d);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.slide .ey{font-family:var(--d);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.slide .tt{font-family:var(--d);font-weight:800;font-size:clamp(16px,2.4vw,23px);line-height:1.1;margin-top:5px}
.slide .st{font-size:12px;margin-top:5px;line-height:1.35}
.slide.navy{background:#003B71;color:#FFFFFF}
.slide.navy .ey{color:#00BCB4}
.slide.navy .st{color:#BFD8E0}
.slide.claro{background:#F6F8F8;color:#003B71;border-color:#D5E3E6}
.slide.claro .ey{color:#006B66}
.slide.claro .st{color:#3D3D3D}
.fam{border-radius:12px;padding:14px 14px 13px;border:1px solid rgba(0,0,0,.05)}
.fam .fl{font-family:var(--d);font-size:15px;font-weight:800}
.fam .fu{font-size:12.5px;color:#3D3D3D;margin-top:3px;line-height:1.4}
.fam .fh{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#3D3D3D;margin-top:8px}
.semaf{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center}
.semaf span{display:inline-flex;align-items:center;gap:9px;font-weight:600;color:var(--ink)}
.semaf i{display:inline-block;flex:none}

/* ---------- pie de página ---------- */
.pager{display:flex;justify-content:space-between;gap:18px;margin-top:52px;padding-top:22px;border-top:1px solid var(--line)}
.pager a{font-size:13.5px}
.pager .lb{display:block;font-family:var(--d);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pager .tt{color:var(--teal-text);font-weight:600}
.stamp{margin-top:26px;font-size:12px;color:var(--faint)}

@media(max-width:900px){

    <span><i style="width:18px;height:18px;border-radius:50%;background:#2E7D32"></i>En meta</span>
    <span><i style="width:16px;height:16px;background:#F5A623;transform:rotate(45deg)"></i>Atención</span>
    <span><i style="width:17px;height:17px;border-radius:2px;background:#C62828"></i>Lejos de la meta</span>
  </div>
  <ul style="margin:14px 0 0;padding-left:18px;font-size:14.5px" class="stack">
    <li><b>Siempre con su forma y su palabra.</b> Con el daltonismo más común, el verde y el rojo casi no se distinguen: la forma y la palabra son lo que se lee.</li>
    <li><b>Se juzga contra la meta del período</b>, aprobada antes de que empiece. Sin meta, no hay semáforo.</li>
    <li><b>Solo en informes internos.</b> En lo que ve un cliente, el rojo es solo de urgencias.</li>
    <li>Verde, ámbar y rojo no se usan para nada más en el mismo informe.</li>
  </ul>
</div>

<details class="tech" style="margin-top:16px">
  <summary><span class="tag-tec">Para quien programa</span> Los códigos y los contrastes</summary>
  <div style="padding:16px 0 4px">
    <div class="tbl-scroll"><table>
      <thead><tr><th>Uso</th><th>Texto</th><th>Fondo</th><th>Ratio</th></tr></thead>
      <tbody>
        <tr><td>Rótulo Llegada</td><td class="mono">#003B71</td><td class="mono">#E6EDF4</td><td class="tnum">9,54:1</td></tr>
        <tr><td>Rótulo Respuesta</td><td class="mono">#4A3A6E</td><td class="mono">#F3EFF8</td><td class="tnum">8,73:1</td></tr>
        <tr><td>Rótulo Utilidad</td><td class="mono">#006B66</td><td class="mono">#E6F7F6</td><td class="tnum">5,77:1</td></tr>
        <tr><td>Rótulo Propuesta</td><td class="mono">#A05640</td><td class="mono">#F8EDE6</td><td class="tnum">4,68:1</td></tr>
        <tr><td>Valor adentro de una barra Lavender-500</td><td class="mono">#003B71</td><td class="mono">#9B84C0</td><td class="tnum">3,46:1 · solo desde 24 px</td></tr>
        <tr><td>Valor adentro de una barra Terracota-200</td><td class="mono">#003B71</td><td class="mono">#DDB29C</td><td class="tnum">5,86:1</td></tr>
        <tr><td>Valor adentro de una barra turquesa</td><td class="mono">#003B71</td><td class="mono">#00BCB4</td><td class="tnum">4,75:1</td></tr>
        <tr><td>Valor adentro de una barra navy</td><td class="mono">#FFFFFF</td><td class="mono">#003B71</td><td class="tnum">11,27:1</td></tr>
      </tbody>
    </table></div>
    <p style="margin-top:12px;font-size:14px">Semáforo: verde <span class="mono">#2E7D32</span>, ámbar <span class="mono">#F5A623</span> (Ámbar-500),
      rojo <span class="mono">#C62828</span>. El verde y el rojo no son de la paleta de marca: son el semáforo clásico, a propósito, y solo viven ahí.</p>
  </div>
</details>

<h2 id="los-tipos-de-lamina" style="margin-top:44px">Los tipos de lámina</h2>
<p class="prose" style="margin-top:10px">Una presentación se arma combinando estos tipos. Las láminas del mismo tipo comparten
  estructura y ubicaciones: cuatro semanas de calendario son cuatro veces la misma grilla, no cuatro diseños.</p>
<div class="tbl-scroll" style="margin-top:14px"><table>
  <thead><tr><th>#</th><th>Tipo</th><th>Para qué</th></tr></thead>
  <tbody>
    <tr><td class="tnum">1</td><td><b>Portada</b></td><td>Siempre. En un informe, el tema y el período completo.</td></tr>
    <tr><td class="tnum">2</td><td><b>Separador</b></td><td>Un cambio de bloque en una presentación larga.</td></tr>
    <tr><td class="tnum">3</td><td><b>Idea</b></td><td>Una frase grande. La unidad básica.</td></tr>
    <tr><td class="tnum">4</td><td><b>Capítulo de historia</b></td><td>Historias por etapas, en charlas y capacitaciones.</td></tr>
    <tr><td class="tnum">5</td><td><b>Dato grande</b></td><td>Una cifra que cambia la decisión, dicha como se diría en voz alta.</td></tr>
    <tr><td class="tnum">6</td><td><b>Tabla</b></td><td>Datos que se comparan con su número exacto.</td></tr>
    <tr><td class="tnum">7</td><td><b>Tarjetas</b></td><td>Pilares, opciones o pasos: tres o cuatro.</td></tr>
    <tr><td class="tnum">8</td><td><b>Foto y mensaje</b></td><td>Personas reales, con su consentimiento. Sin foto real, la lámina va sin imagen.</td></tr>
    <tr><td class="tnum">9</td><td><b>Cita</b></td><td>La voz de un cliente, textual y verificada.</td></tr>
    <tr><td class="tnum">10</td><td><b>Impacto</b></td><td>El momento que se recuerda, sobre turquesa. Una sola por presentación.</td></tr>
    <tr><td class="tnum">11</td><td><b>Pregunta o acción</b></td><td>Lo que se decide o lo que se lleva la sala.</td></tr>
    <tr><td class="tnum">12</td><td><b>Participación</b></td><td>Una dinámica, con el tiempo en una píldora ámbar.</td></tr>
    <tr><td class="tnum">13</td><td><b>Cierre</b></td><td>Siempre. En un informe, una o dos frases que resumen el período.</td></tr>
    <tr><td class="tnum">14</td><td><b>Respuesta</b></td><td>La lámina 2 de todo informe: tres hallazgos numerados y lo que se decide.</td></tr>
    <tr><td class="tnum">15</td><td><b>Tablero</b></td><td>Hasta seis cifras, cada una con su comparación y su familia de color.</td></tr>
    <tr><td class="tnum">16</td><td><b>Top 10 con su porqué</b></td><td>Las que más rindieron, en barras con su valor y una línea con su porqué.</td></tr>
    <tr><td class="tnum">17</td><td><b>Base y meta</b></td><td>Las metas del período que viene, cada una con su porqué.</td></tr>
    <tr><td class="tnum">18</td><td><b>Calendario</b></td><td>El plan, siempre con la misma grilla: día, formato, tema y qué se le pide a la persona.</td></tr>
    <tr><td class="tnum">19</td><td><b>Límites de lectura</b></td><td>Obligatoria en todo informe con datos: lo que no se puede concluir.</td></tr>
    <tr><td class="tnum">20</td><td><b>Las mejores, a la vista</b></td><td>En un informe de redes: las tres mejores con su captura real, en porcentaje y en número.</td></tr>
    <tr><td class="tnum">21</td><td><b>Anexo</b></td><td>El detalle que no entra en el cuerpo, en fondo blanco.</td></tr>
    <tr><td class="tnum">22</td><td><b>Hitos</b></td><td>Un plan por etapas: hasta cinco pasos, cada uno con su estado.</td></tr>
    <tr><td class="tnum">23</td><td><b>Tabla con veredicto</b></td><td>Qué hacer con cada pieza: repetir, ajustar o cambiar el enfoque, con su porqué.</td></tr>
  </tbody>
</table></div>

<h2 id="que-grafico-para-que" style="margin-top:44px">Qué gráfico para qué</h2>
<p class="prose" style="margin-top:10px">La forma se elige por lo que se quiere mostrar, no por costumbre.</p>
<div class="tbl-scroll" style="margin-top:14px"><table>
  <thead><tr><th>Si querés mostrar…</th><th>Usá</th><th>Cómo</th></tr></thead>
  <tbody>
    <tr><td>Cómo cambió algo entre dos períodos</td><td><b>Barras agrupadas</b></td><td>El período anterior en Navy-200 y el actual en color; el número arriba de cada barra y el cambio en porcentaje arriba de cada grupo.</td></tr>
    <tr><td>De qué está hecho un total</td><td><b>Una barra entera</b></td><td>Una barra al 100% por período; adentro, el porcentaje y la cantidad («47% · 9»).</td></tr>
    <tr><td>Lo que pasó a lo largo de un mes</td><td><b>Una columna por pieza en su fecha</b></td><td>Un eje del 1 al último día, cada día a su distancia real, con la mediana punteada.</td></tr>
    <tr><td>Una serie que sí es continua</td><td><b>Línea</b></td><td>Un valor por día, como el alcance diario de una cuenta. Primer y último valor escritos.</td></tr>
    <tr><td>Cuánto falta para la meta</td><td><b>Avance con semáforo</b></td><td>Una fila por indicador: la barra llena es la meta; el valor y la meta en números («420 · 500»).</td></tr>
    <tr><td>De dónde viene el cambio de una tasa</td><td><b>Barra partida en sus causas</b></td><td>Cuánto viene de lo de arriba de la división y cuánto de lo de abajo, dicho en palabras al lado.</td></tr>
    <tr><td>Una parte chica de algo grande</td><td><b>Dos barras a escala</b></td><td>La parte y el todo en la misma escala, con los dos números.</td></tr>
    <tr><td>Una proporción que sorprende</td><td><b>Cuadros para contar</b></td><td>Un cuadro por cosa en el primer bloque y uno por cada 1% en el segundo: «2 de cada 10 piezas, la mitad de las interacciones».</td></tr>
    <tr><td>Las que más y las que menos rindieron</td><td><b>Las mejores a la vista</b> y <b>Top 10</b></td><td>Las tres mejores con su captura; después el top 10 en barras, y la tabla con veredicto para las que menos rindieron.</td></tr>
    <tr><td>Una cifra que cambia la decisión</td><td><b>Dato grande</b></td><td>Dicha como se diría en voz alta, con la frase que la explica.</td></tr>
  </tbody>
</table></div>
<div class="warn" style="margin-top:16px"><b>No van:</b> torta ni dona (el ojo compara mal ángulos), gráficos con dos escalas,
  barras de colores sin leyenda, líneas que unen piezas sueltas (dibujan una tendencia que no existe) ni números sin su base.</div>

<h2 id="informes-con-datos" style="margin-top:44px">Informes con datos</h2>
<p class="prose" style="margin-top:10px">Un informe lindo con la base equivocada convence más rápido que uno feo, y nadie revisa
  lo que se ve bien. Por eso un buen diseño no alcanza: los números se tienen que poder seguir.</p>
<ul class="prose stack" style="margin:12px 0 0;padding-left:20px">
  <li><b>Cada cifra lleva su fuente y su período</b> en el pie, y una etiqueta en palabra:
      <b>Medido</b>, <b>Supuesto</b>, <b>Inferencia</b> o <b>Proyección</b>.</li>
  <li><b>Cada cifra técnica se explica en la misma lámina</b>, en palabras de todos los días: «llegó a unas 30 veces más
      gente», no «es del orden del 3%». Las notas del orador amplían; no explican.</li>
  <li><b>Un informe de un mes habla solo de ese mes</b>, del 1 al último día. Los números se bajan apenas cierra.</li>
  <li><b>Períodos con distinta cantidad de piezas se comparan por pieza.</b> Un mes con más publicaciones «crece» solo.</li>
  <li><b>Una tasa nunca va sola:</b> va con lo que la forma, y se dice cuál de las dos partes la movió.</li>
  <li><b>Lo que coincide en el tiempo se dice como coincidencia</b>, no como causa.</li>
  <li><b>Las piezas de redes se muestran con su captura real</b>, entera y vertical. Nunca un cuadro de relleno.</li>
  <li><b>La jerga se traduce:</b> tablero (no <i>scorecard</i>), tasa de interacción (no <i>engagement</i>), las que menos
      rindieron (no <i>underperformers</i>), qué le pedimos a la persona (no <i>CTA</i>).</li>
  <li><b>Lo que la fuente no entrega se marca «no disponible»</b>, nunca se completa sin decirlo.</li>
</ul>

<h2 id="antes-de-entregar" style="margin-top:44px">Antes de entregar</h2>
<ul class="prose stack" style="margin:12px 0 0;padding-left:20px">
  <li><b>Revisá el PDF exportado</b>, página por página, no el archivo de origen. Las viñetas que salen como texto, los
      títulos partidos letra por letra o una fuente que no es Nunito Sans ni Inter aparecen recién ahí.</li>
  <li><b>Las partes suman el total</b> y cada variación se recalcula desde la base.</li>
  <li><b>Nada decorativo que no diga algo:</b> ni formas abstractas, ni íconos de librería, ni fotos de stock.</li>
  <li><b>Hacia afuera de SP no van</b> la inversión publicitaria ni los resultados propios sin el OK de Marketing, datos de
      salud de una persona que se pueda identificar, ni el nombre de una persona al lado de una falla.</li>
  <li><b>Una afirmación de cobertura, precio o plazo</b> necesita aprobación, como en cualquier pieza: ver
      <a href="#/agencias" style="color:var(--teal-text);font-weight:600;text-decoration:underline">Para agencias</a>.</li>
  <li><b>El nombre del archivo</b> sigue la convención:
      <span class="mono">AAAAMMDD_SP_Presentacion_16x9-[concepto]-[canal]_v[n]</span>.</li>
</ul>

<div class="warn" style="margin-top:26px"><b>Falta la plantilla de PowerPoint.</b> El formato está escrito acá, pero todavía no
  hay un archivo <span class="mono">.potx</span> que lo traiga armado. Mientras tanto, se arma con estas reglas, los
  <a href="#/iconos" style="font-weight:600;text-decoration:underline">íconos</a> y las dos tipografías.
  Está pedida en <a href="#/faltantes" style="font-weight:600;text-decoration:underline">Qué falta y qué llegó</a>.
  <span class="pill p-gap" style="margin-left:4px">Pendiente</span></div>`;

V['/lockup'] = () => `
<div class="eyebrow">Logo</div>
<h1>Marca junto a otra marca</h1>
<p class="verdict long">La marca de SP nunca se pega a otra. Entre las dos hay aire, y ese aire ya tiene una medida.</p>
<p class="lede prose">SP aparece hoy al lado de una docena de marcas aliadas, y hasta ahora cada pieza lo resolvía a ojo.
  Esta página fija las reglas. No inventa medidas nuevas: las saca de las que este mismo centro ya publica.</p>

<h2 id="la-separacion" style="margin-top:44px">La separación</h2>
<p class="prose" style="margin-top:10px">Ya está publicado que alrededor del logo de SP tiene que quedar un espacio vacío
  del tamaño de <b>la altura de la letra "a" del logotipo</b>, y que ahí no entra nada. Como el logotipo va todo en
  mayúsculas —dice <span class="mono">SALUD PROTEGIDA</span>—, esa letra es <b>la "A" mayúscula</b>: la altura de la A
  de SALUD. La otra marca también tiene su propia área de resguardo. Cuando las dos conviven hay que respetar las dos,
  así que el espacio entre ellas es <b>la suma de ambas</b>, y nunca menos de dos A.</p>
<div class="lk" style="margin-top:16px">
  <img class="sp" src="${A.isologoFull}" alt="Isologotipo de Salud Protegida">
  <div class="aire" style="width:76px">2 × A</div>
  <div class="otra">Otra marca</div>
</div>
<p class="lk-cap"><b>Si no sabés cuánto mide la A de la otra marca</b>, usá dos veces la de SP. Pasarse de aire nunca
  rompió una pieza; quedarse corto sí. <span style="color:var(--faint)">El diagrama marca dónde va el aire; no está
  dibujado a escala.</span></p>
<div class="note" style="margin-top:16px"><b>Una raya en el medio es opcional, y casi siempre sobra.</b> Si la usás, que
  sea fina, gris, de la mitad de alto que las marcas, y que no coma el aire: va centrada dentro de ese espacio, no
  en lugar de él.</div>

<h2 id="cual-va-primero" style="margin-top:44px">Cuál va primero</h2>
<p class="prose" style="margin-top:10px">Manda <b>de quién es la pieza</b>, no quién es más grande ni quién pagó.
  Si la pieza sale de SP, SP va primera —a la izquierda, o arriba si van apiladas—. Si la pieza es del aliado y SP
  aparece como respaldo, es al revés. Dentro de una misma campaña el orden no se cambia de pieza en pieza.</p>
<div class="grid g2" style="margin-top:14px">
  <div>
    <div class="lk"><img class="sp" src="${A.isologoFull}" alt=""><div class="aire" style="width:52px">aire</div><div class="otra">Aliado</div></div>
    <p class="lk-cap"><b>Pieza de SP.</b> La invitación, el folleto, el posteo lo hace SP.</p>
  </div>
  <div>
    <div class="lk"><div class="otra">Aliado</div><div class="aire" style="width:52px">aire</div><img class="sp" src="${A.isologoFull}" alt=""></div>
    <p class="lk-cap"><b>Pieza del aliado.</b> SP acompaña; la voz es del otro.</p>
  </div>
</div>

<h2 id="que-version-de-sp-usar" style="margin-top:44px">Qué versión de SP usar</h2>
<p class="prose" style="margin-top:10px">La decide el fondo sobre el que caen las dos marcas, no el color del logo del
  aliado. Es la misma regla de siempre, y acá se vuelve más fácil de romper porque uno mira el logo de al lado en vez
  de mirar el fondo.</p>
<div class="tbl-scroll" style="margin-top:14px"><table>
  <thead><tr><th>Fondo de la pieza</th><th>Versión de SP</th><th>Archivo</th></tr></thead>

    <tr><td>Una sola tinta</td><td><b>Negra</b> o navy</td><td><span class="mono">SP_Isologotipo_Negro_RGB</span></td></tr>
  </tbody>
</table></div>
<div class="warn" style="margin-top:14px"><b>El error más común del lockup.</b> Poner el SP fullcolor sobre un fondo de
  color porque el logo del aliado es de color y "hace juego". Sobre fondo de color o foto va la versión blanca,
  siempre. Si el aliado necesita su versión de color y el fondo no se lo permite, el que cambia es el fondo.</div>

<h2 id="se-igualan-por-peso-no-por-ancho" style="margin-top:44px">Se igualan por peso, no por ancho</h2>

  Billio queda enorme y Punto Farma desaparece.</p>
<p class="prose" style="margin-top:10px">La forma que funciona: igualar <b>la altura de las letras</b>, o —si uno es un
  símbolo y el otro un logotipo— igualar el área que ocupa cada mancha. Es a ojo, y el ojo tiene razón: si parecen del
  mismo tamaño, están bien, aunque los números digan otra cosa.</p>

<h2 id="que-no-se-hace-nunca" style="margin-top:44px">Qué no se hace nunca</h2>

  <div class="card"><b>Recolorear el logo del aliado para que combine con la paleta de SP.</b> <span style="color:var(--muted)">Es
    su marca, no la nuestra. Va con sus colores o en blanco, si el aliado tiene versión blanca.</span></div>
  <div class="card"><b>Mezclar el orden dentro de una misma campaña.</b> <span style="color:var(--muted)">SP a la
    izquierda en el folleto y a la derecha en el banner se lee como descuido.</span></div>
  <div class="card"><b>Sumar tres o más marcas sin jerarquía.</b> <span style="color:var(--muted)">Una fila de logos

</div>
<div class="note" style="margin-top:18px"><b>Estas reglas están escritas, no acordadas.</b> Salen de las medidas que

  aliados. Sirven para trabajar; conviene confirmarlas antes de tratarlas como definitivas.
  <span class="pill p-gap" style="margin-left:4px">Sin confirmar</span></div>`;

  <b>6,4 cm de ancho</b>: más chico que una tarjeta personal. El isotipo llega a 14,9 cm. Para un banner, una vidriera
  o un cartel no alcanza, y no hay forma de agrandarlo sin que se pixele.
  <span class="pill p-gap" style="margin-left:4px">Bloqueante</span></div>

<h2 id="para-encargar-a-un-disenador" style="margin-top:44px">Para encargar a un diseñador</h2>
<p class="prose" style="margin-top:10px">Cada fila trae <b>el nombre exacto con el que tiene que volver el archivo</b>. No es un capricho:
  el sitio referencia los archivos por nombre y es lo que ve el proveedor cuando descarga, así que un archivo que
  vuelve con otro nombre hay que renombrarlo a mano y se rompe en dos lugares. Con esa columna, lo que entrega el
  diseñador entra al centro sin tocar nada.</p>

<div class="warn" style="margin-top:16px"><b>Ojo con los nombres.</b> Los de los vectoriales

  firma y la imagen para compartir son una <b>propuesta</b>: estiran la misma convención a piezas que

  mensaje; redibujarlo cuesta un presupuesto, y el redibujo nunca queda idéntico.</div>

/* ---------- router ---------- */
function railFor(id){
  let html=''; let last=null;
  PAGES.forEach(p=>{
    if(!p.g){return}
    if(p.g!==last){html+=`<div class="grp">${esc(p.g)}</div>`;last=p.g}
    html+=`<a href="#${p.id}" class="${p.id===id?'on':''}">${esc(p.t)}</a>`;
    if(p.id===id && p.sub){p.sub.forEach(s=>{html+=`<a class="sub" href="#${p.id}#${anchor(s)}">${esc(s)}</a>`})}
  });
  return `<a href="#/" class="${id==='/'?'on':''}" style="font-family:var(--d);font-weight:700">Inicio</a>`+html;
}
function pagerFor(id){
  const i=PAGES.findIndex(p=>p.id===id); if(i<0)return'';
  const prev=PAGES[i-1], next=PAGES[i+1];
  return `<nav class="pager" aria-label="Página anterior y siguiente">
    <div>${prev?`<a href="#${prev.id}"><span class="lb">${esc(prev.g||'Inicio')}</span><span class="tt">← ${esc(prev.t)}</span></a>`:''}</div>
    <div style="text-align:right">${next?`<a href="#${next.id}"><span class="lb">${esc(next.g)}</span><span class="tt">${esc(next.t)} →</span></a>`:''}</div>
  </nav>
  <div class="stamp">Actualizado el 06/10/2026 · Centro de Marca v1.4</div>`;
}
function route(){
  const raw=location.hash.slice(1)||'/';
  const [id,frag]=raw.split('#');
  const view=V[id]||V['/'];
  document.getElementById('view').innerHTML=view()+pagerFor(id);
  document.getElementById('rail').innerHTML=railFor(id);
  document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('on'));
  if(frag){const el=document.getElementById(frag); if(el){el.scrollIntoView({block:'start'})} else {scrollTo(0,0)}}
  else scrollTo(0,0);
  if(innerWidth<=900) document.getElementById('rail').classList.remove('open');
}
addEventListener('hashchange',route);

document.querySelectorAll('[data-drop]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    const w=b.parentElement, was=w.classList.contains('on');
    document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('on'));
    if(!was) w.classList.add('on');
  });
});
document.addEventListener('click',()=>document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('on')));

  const b=e.target.closest('[data-copy]'); if(!b) return;
  const v=b.dataset.copy; const old=b.textContent;
  /* El acuse repite el valor copiado, que es lo correcto para un hex. Un pedido de
     treinta líneas no entra en un botón: ahí el bloque declara su propio data-ok. */
  const ok=b.dataset.ok || (v+' ✓');
  navigator.clipboard?.writeText(v).then(()=>{b.textContent=ok;setTimeout(()=>b.textContent=old,1100)}).catch(()=>{});
});

const root=document.documentElement;
document.getElementById('theme').addEventListener('click',()=>{
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=root.dataset.theme||(dark?'dark':'light');
  root.dataset.theme = cur==='dark'?'light':'dark';
});
document.getElementById('burger').addEventListener('click',()=>document.getElementById('rail').classList.toggle('open'));

route();
</script>
